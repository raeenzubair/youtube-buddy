<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Buddy — YouTube Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- Header -->
    <header>
      <div class="logo">YouTube<span>Buddy</span></div>
      <div class="tagline">v2.0 — yt-dlp powered</div>
    </header>

    <!-- Hero -->
    <div class="hero fade-up">
      <h1>DOWNLOAD <em>ANYTHING</em><br>FROM YOUTUBE</h1>
      <p>Paste a video URL or channel link. Get video, audio, or thumbnail — instantly.</p>
    </div>

    <!-- Search -->
    <div class="search-wrap fade-up fade-up-d1">
      <div class="search-bar">
        <input
          type="text"
          id="urlInput"
          placeholder="https://youtube.com/watch?v=... or channel URL"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="btn-fetch" id="fetchBtn" onclick="fetchInfo()">
          <svg viewBox="0 0 20 20" fill="currentColor" style="width:16px;height:16px;vertical-align:middle;margin-right:6px">
            <path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 14a6 6 0 110-12 6 6 0 010 12zm-1-5l4-3-4-3v6z"/>
          </svg>
          Analyze
        </button>
      </div>

      <!-- Live URL type indicator -->
      <div class="url-type-indicator" id="urlTypeIndicator" style="display:none;">
        <span class="type-badge" id="typeBadge"></span>
        <span class="type-hint" id="typeHint"></span>
      </div>

      <!-- Example pills -->
      <div class="examples">
        <span class="pill" onclick="setExample('video')">📹 Try a video</span>
        <span class="pill" onclick="setExample('channel')">📺 Try a channel</span>
        <span class="pill" onclick="setExample('playlist')">🎵 Try a playlist</span>
      </div>
    </div>

    <!-- Error box -->
    <div class="error-box" id="errorBox"></div>

    <!-- Loader -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p id="loaderText">Analyzing URL...</p>
    </div>

    <!-- Result area -->
    <div id="result"></div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Video Preview Modal -->
  <div class="modal-backdrop" id="previewModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" id="modalCloseBtn">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
          </svg>
        </button>
      </div>
      <div class="modal-embed">
        <iframe id="previewIframe" src="" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
